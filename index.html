<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111429"><meta name="description" content="Tap matching blocks. 15 moves. One friendly challenge. తెలుగు ట్యాప్ పాప్ గేమ్."><title>Tap Pop Challenge | ట్యాప్ పాప్</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1022;color:#f4f5ff;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;background-image:radial-gradient(ellipse at 50% 0,#30365b 0,transparent 65%)}main{max-width:450px;margin:auto;padding:20px 16px 24px}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#aeb5d9;font-weight:700}h1{font-size:28px;line-height:1.1;margin:7px 0}h1 span{color:#aff7d2}.hbtns{display:flex;gap:8px}.lang{border:1px solid #505a80;background:transparent;color:#fff;border-radius:12px;padding:9px;font-weight:700}p{color:#bbc3e0;font-size:14px;line-height:1.6;margin:12px 0}.stats{display:flex;gap:8px;margin:17px 0 12px}.stat{flex:1;background:#1d2440;border:1px solid #343c5a;border-radius:15px;padding:10px 12px}.stat small{display:block;font-size:11px;color:#bec6e3}.stat strong{display:block;font-size:25px;margin-top:2px}#status{min-height:42px;color:#aff7d2;font-size:14px;font-weight:600;line-height:1.5}#board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px;background:#080d1c;border:1px solid #38435e;border-radius:22px;aspect-ratio:1}.tile{border:none;min-width:0;width:100%;aspect-ratio:1;border-radius:12px;font-size:24px;color:#162139;box-shadow:inset 0 -5px #0002;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}.tile:active{transform:scale(.9)}.tile:focus-visible{outline:3px solid white;outline-offset:2px}.c0{background:#ffabbb}.c1{background:#83c9ff}.c2{background:#ffe392}.c3{background:#92edbd}.empty{visibility:hidden}.hint{outline:3px solid #fff;filter:brightness(1.18)}.actions{display:flex;gap:8px;margin-top:14px}button{font-family:inherit;cursor:pointer}button:disabled{cursor:default}.primary,.secondary{border:0;border-radius:14px;padding:13px 8px;font-size:14px;font-weight:750;min-height:48px}.primary{background:#aff7d2;color:#112638;flex:1.4}.secondary{background:#293451;color:white;flex:1}footer{text-align:center;color:#858fab;font-size:11px;line-height:1.7;margin-top:17px}#summary{display:none;padding:12px 15px;border:1px solid #aff7d266;border-radius:14px;background:#16342e;margin-top:12px;font-size:14px;line-height:1.6}#shareout{display:none;word-break:break-all;user-select:all;background:#1d2440;color:#fff;padding:10px;border-radius:12px;font-size:12px}.badge{font-size:12px;color:#d4dcf7;margin-top:8px} @media(max-width:350px){main{padding:14px 10px}.tile{font-size:21px}#board{gap:5px;padding:9px}h1{font-size:25px}} @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div><div class="eyebrow">15 MOVES · ONE CHALLENGE</div><h1>Tap <span>Pop</span> ✦</h1></div><div class="hbtns"><button class="lang" id="snd" aria-label="Sound" aria-pressed="true">🔊</button><button class="lang" id="lang" aria-label="Change language">English</button></div></header><p id="rules"></p><div class="stats"><div class="stat"><small id="scorelabel"></small><strong id="score">0</strong></div><div class="stat"><small id="moveslabel"></small><strong id="moves">15</strong></div><div class="stat"><small id="bestlabel"></small><strong id="best">0</strong></div></div><div id="status" role="status" aria-live="polite"></div><div id="board" aria-label="Puzzle board"></div><div id="summary" role="status"></div><div class="actions"><button class="primary" id="share"></button><button class="secondary" id="hint"></button><button class="secondary" id="again"></button></div><div class="badge" id="challenge"></div><p id="shareout"></p><footer id="footer"></footer></main><script>
'use strict';
let te=true,score=0,moves=15,over=false,board=[],seed=0,rng,oldBest=0,hints=0;const symbols=['●','◆','★','✿'];const $=id=>document.getElementById(id);
const text={te:{rules:'పక్కపక్కన ఉన్న ఒకే రంగు బ్లాక్స్ (2+) ట్యాప్ చేయండి. పెద్ద గ్రూప్ = ఎక్కువ స్కోర్!',scorelabel:'స్కోర్',moveslabel:'మిగిలిన moves',bestlabel:'మీ బెస్ట్',share:'ఫ్రెండ్‌కు ఛాలెంజ్ ↗',hint:'హింట్',again:'కొత్త గేమ్',ready:'15 moves. మీ బెస్ట్ స్కోర్ సాధించండి!',single:'ఒంటరి బ్లాక్ కాదు. 2+ గ్రూప్ ఎంచుకోండి.',end:'గేమ్ పూర్తయింది!',no:'ఇంకా గ్రూప్స్ లేవు.',footer:'Install లేదు · Login లేదు · Ads లేవు<br>మీ స్కోర్ ఈ browserలో మాత్రమే సేవ్ అవుతుంది.',copy:'లింక్ కాపీ అయింది. ఫ్రెండ్‌కు పంపండి!',manual:'ఈ లింక్ కాపీ చేసి పంపండి:',challenge:'అందరికీ ఇదే బోర్డ్. మీ స్కోర్ దాటమని చెప్పండి!',hintmsg:'తెల్ల గీత ఉన్న గ్రూప్ చూడండి.',plus:'పాయింట్లు',finish:'మళ్లీ ఆడాలా? కొత్త గేమ్ నొక్కండి.'},en:{rules:'Tap connected groups of 2+ matching blocks. Bigger group = more points!',scorelabel:'SCORE',moveslabel:'MOVES LEFT',bestlabel:'YOUR BEST',share:'Challenge a friend ↗',hint:'Hint',again:'New game',ready:'15 moves. Make your best score!',single:'That block is alone. Find a group of 2+.',end:'Round complete!',no:'No groups left.',footer:'No install · No login · No ads<br>Your best score stays in this browser.',copy:'Link copied. Send it to a friend!',manual:'Copy and send this link:',challenge:'Same board for your friend. Can they beat you?',hintmsg:'Try the group with the white outline.',plus:'points',finish:'Want another round? Tap New game.'}};

let muted=false;try{muted=localStorage.getItem('tap-pop-muted-v1')==='1'}catch{}
let ac=null,master=null;
function audio(){if(muted)return null;try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination)}if(ac.state!=='running'&&ac.resume)ac.resume();return ac}catch{return null}}
function tone(f,t0,d,type,vol,slide){const a=ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const st=a.currentTime+t0;o.frequency.setValueAtTime(f,st);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),st+d);g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol||.3,st+.008);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(master);o.start(st);o.stop(st+d+.03)}
function sfx(k,n){try{if(!audio())return;if(k==='pop'){const b=380+Math.min(n,12)*45;tone(b,0,.13,'sine',.4,2.2);tone(b*1.5,.02,.08,'triangle',.12)}else if(k==='combo'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.2,'triangle',.28));tone(150,0,.2,'sine',.35,.5)}else if(k==='nope'){tone(190,0,.14,'square',.08,.7)}else if(k==='hint'){tone(880,0,.1,'sine',.2);tone(1175,.09,.12,'sine',.2)}else if(k==='end'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,i===6?.5:.18,'triangle',.3))}else if(k==='ui'){tone(620,0,.06,'sine',.2)}}catch{}}
function sndBtn(){const b=$('snd');b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-pressed',String(!muted));b.setAttribute('aria-label',muted?'Sound off':'Sound on')}
const t=k=>text[te?'te':'en'][k];function getBest(){try{return +localStorage.getItem('tap-pop-best-v1')||0}catch{return 0}}
function randomSeed(){const a=new Uint32Array(1);if(window.crypto?.getRandomValues)crypto.getRandomValues(a);else a[0]=Date.now();return a[0]||1}
function makeRng(s){return ()=>{s|=0;s=s+0x6D2B79F5|0;let v=Math.imul(s^s>>>15,1|s);v=v+Math.imul(v^v>>>7,61|v)^v;return((v^v>>>14)>>>0)/4294967296}}
function group(i){if(board[i]<0)return[];const seen=new Set([i]),stack=[i],value=board[i];while(stack.length){const n=stack.pop(),r=Math.floor(n/6),c=n%6;for(const [y,x] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){const k=y*6+x;if(y>=0&&y<6&&x>=0&&x<6&&board[k]===value&&!seen.has(k)){seen.add(k);stack.push(k)}}}return [...seen]}
function groups(){return board.map((_,i)=>group(i)).filter(g=>g.length>1)}
function render(){for(const k of ['rules','scorelabel','moveslabel','bestlabel','share','hint','again','footer'])$(k).innerHTML=t(k);$('lang').textContent=te?'English':'తెలుగు';$('score').textContent=score;$('moves').textContent=moves;$('best').textContent=getBest();$('hint').disabled=over;$('board').replaceChildren();board.forEach((v,i)=>{const b=document.createElement('button');b.className='tile '+(v<0?'empty':'c'+v);b.textContent=v<0?'':symbols[v];b.disabled=v<0||over;b.setAttribute('aria-label',(te?'బ్లాక్ ':'Block ')+(i+1)+' '+(v<0?'empty':symbols[v]));b.onclick=()=>tap(i);$('board').append(b)});$('challenge').textContent=t('challenge');if(over){$('summary').style.display='block';$('summary').textContent=t('end')+' '+score+' '+t('plus')+'. '+t('finish')}}
function tap(i){if(over)return;const g=group(i);if(g.length<2){sfx('nope');$('status').textContent=t('single');return}sfx(g.length>=5?'combo':'pop',g.length);g.forEach(n=>board[n]=-1);const gained=g.length*g.length*5;score+=gained;moves--;for(let c=0;c<6;c++){const col=[];for(let r=0;r<6;r++)if(board[r*6+c]>=0)col.push(board[r*6+c]);while(col.length<6)col.unshift(Math.floor(rng()*4));for(let r=0;r<6;r++)board[r*6+c]=col[r]}
if(score>getBest())try{localStorage.setItem('tap-pop-best-v1',score)}catch{} over=moves===0||groups().length===0;render();if(over)setTimeout(()=>sfx('end'),g.length>=5?380:150);$('status').textContent=over?t('end'):'+'+gained+' '+t('plus')+' · '+g.length+' blocks';}
function start(s){seed=s>>>0||1;rng=makeRng(seed);board=Array.from({length:36},()=>Math.floor(rng()*4));score=0;moves=15;hints=0;over=false;oldBest=getBest();$('summary').style.display='none';$('shareout').style.display='none';render();$('status').textContent=t('ready');if(!groups().length){board[1]=board[0];render()}}
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('tap-pop-muted-v1',muted?'1':'0')}catch{}sndBtn();if(!muted)sfx('ui')};sndBtn();
$('lang').onclick=()=>{sfx('ui');te=!te;render();$('status').textContent=over?t('end'):t('ready')};$('again').onclick=()=>{sfx('ui');const s=randomSeed();const u=new URL(location.href);u.search='';u.searchParams.set('seed',s);history.replaceState(null,'',u);start(s)};
$('hint').onclick=()=>{if(over)return;const gs=groups().sort((a,b)=>b.length-a.length);if(!gs.length)return;document.querySelectorAll('.hint').forEach(b=>b.classList.remove('hint'));gs[0].forEach(i=>$('board').children[i].classList.add('hint'));hints++;sfx('hint');$('status').textContent=t('hintmsg')};
$('share').onclick=async()=>{const u=new URL(location.href);u.search='';u.searchParams.set('seed',seed);const msg=te?'Tap Popలో నా స్కోర్ '+score+'! ఇదే బోర్డ్‌లో మీ స్కోర్ ఎంత?':'My Tap Pop score is '+score+'! Try the same board.';const data={title:'Tap Pop Challenge',text:msg,url:u.href};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(msg+'\n'+u.href);$('status').textContent=t('copy')}catch{$('shareout').textContent=msg+' '+u.href;$('shareout').style.display='block';$('status').textContent=t('manual')}};
const raw=new URL(location.href).searchParams.get('seed');start(raw&&/^\d{1,10}$/.test(raw)?Number(raw):randomSeed());
</script></body></html>
