 *{box-sizing:border-box}body{margin:0;background:#0c1022;color:#f4f5ff;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;background-image:radial-gradient(ellipse at 50% 0,#30365b 0,transparent 65%)}main{max-width:450px;margin:auto;padding:20px 16px 24px}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#aeb5d9;font-weight:700}h1{font-size:28px;line-height:1.1;margin:7px 0}h1 span{color:#aff7d2}.hbtns{display:flex;gap:8px}.lang{border:1px solid #505a80;background:transparent;color:#fff;border-radius:12px;padding:9px;font-weight:700}p{color:#bbc3e0;font-size:14px;line-height:1.6;margin:12px 0}.stats{display:flex;gap:8px;margin:17px 0 12px}.stat{flex:1;background:#1d2440;border:1px solid #343c5a;border-radius:15px;padding:10px 12px}.stat small{display:block;font-size:11px;color:#bec6e3}.stat strong{display:block;font-size:25px;margin-top:2px}#status{min-height:42px;color:#aff7d2;font-size:14px;font-weight:600;line-height:1.5}#board{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px;background:#080d1c;border:1px solid #38435e;border-radius:22px;aspect-ratio:1}.tile{border:3px solid #ffd76a;min-width:0;width:100%;aspect-ratio:1;border-radius:50%;font-size:24px;font-weight:800;color:#162139;box-shadow:inset 0 -5px #0003,inset 0 3px #fff8,0 2px 5px #0006;background-image:radial-gradient(circle at 32% 28%,#fff9,#fff0 55%);cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}.tile:active{transform:scale(.9)}.tile:focus-visible{outline:3px solid white;outline-offset:2px}.c0{background:#ffabbb}.c1{background:#83c9ff}.c2{background:#ffe392}.c3{background:#92edbd}.empty{visibility:hidden}.hint{outline:3px solid #fff;filter:brightness(1.18)}.actions{display:flex;gap:8px;margin-top:14px}button{font-family:inherit;cursor:pointer}button:disabled{cursor:default}.primary,.secondary{border:0;border-radius:14px;padding:13px 8p body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 20%,#27dafa12,transparent 50%),radial-gradient(ellipse at 80% 75%,#a15bff16,transparent 50%);animation:aurora 8s ease-in-out infinite alternate;z-index:-1}

 return best}

let G=null,te=true,busy=false,armed=false,roundId=0,oldBest=0,modalOpen=false,timerId=null,lastTick=0,lastSec=-1;
const $=id=>document.getElementById(id);const PRAISE=[[20,'LEGENDARY!'],[12,'EPIC!'],[8,'AWESOME!'],[5,'GREAT!'],[4,'NICE!']];const symbols=['●','◆','★','✿','💣','⚡','▣'];const NL=50;const hasClock=g=>g.mode==='rush'||(g.mode==='puzzle'&&!!g.goal.time);
const MODES=['puzzle','classic','rush','zen'];
const t=k=>text[te?'te':'en'][k];
function ls(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch{return d}}function ss(k,v){try{localStorage.setItem(k,v)}catch{}}
function jl(k,d){try{return JSON.parse(ls(k,''))||d}catch{return d}}
te=ls('tp5-lang','te')!=='en';
function bestKey(m){return m==='classic'?'tap-pop-best-v2':'tp5-best-'+m}
function getBest(m){return +ls(bestKey(m||G.mode),0)||0}
function getXp(){return +ls('tap-pop-xp-v1',0)||0}
function lvOf(x){return 1+Math.floor(Math.sqrt(x/500))}
function titleOf(l){const k=l>=10?3:l>=6?2:l>=3?1:0;return (te?['కొత్తవాడు','ప్రో','మాస్టర్','లెజెండ్']:['Rookie','Pro','Master','Legend'])[k]}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function randomSeed(){const a=new Uint32Array(1);if(window.crypto?.getRandomValues)crypto.getRandomValues(a);else a[0]=Date.now();return a[0]||1}
function plsStars(){return jl('tp5-lvl',[])}
function lvlStars(l){return +plsStars()[l-1]||0}
function nextLevel(){const a=plsStars();for(let l=1;l<=NL;l++)if(!a[l-1])return l;return NL}
function fmt(x){return x.toFixed(2).replace(/\.?0+$/,'')}
const dot=c=>'<span class="dot c'+c+'">'+symbols[c]+'</span>';
function oneGoal(m){if(m.t==='score')return m.n+' '+t('m_score');if(m.t==='clear')return dot(m.c)+' ×'+m.n+' '+t('m_clear');if(m.t==='power')return '×'+m.n+' '+t('m_power');
 if(m.t==='combo')return '×'+m.n+' '+t('times')+' · '+t('m_combo');if(m.t==='stone')return '▣ ×'+m.n+' '+t('m_stone');if(m.t==='ice')return '❄ ×'+m.n+' '+t('m_ice');return m.n+'+ '+t('m_big')}
function missionText(g,pr){const l=pr?goalProg(g)[2]:null;return '🎯 '+g.goal.g.map((m,i)=>oneGoal(m)+(l?' <small>('+l[i][0]+'/'+l[i][1]+')</small>':'')).join(' + ')+(g.goal.time?' · ⏱'+g.goal.time+'s':'')}

let muted=false;try{muted=localStorage.getItem('tap-pop-muted-v1')==='1'}catch{}
let ac=null,master=null,nbuf=null;
function audio(){if(muted)return null;try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;master=ac.createGain();master.gain.value=1.15;master.connect(comp);comp.connect(ac.destination);nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state!=='running'&&ac.resume)ac.resume();return ac}catch{return null}}
function tone(f,t0,d,type,vol,slide){const a=ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';const st=a.currentTime+t0;o.frequency.setValueAtTime(f,st);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f*slide),st+d);g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol||.3,st+.006);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(master);o.start(st);o.stop(st+d+.03)}
function noise(t0,d,vol,f0,f1,type){const a=ac;if(!a||!nbuf)return;const s=a.createBufferSource();s.buffer=nbuf;s.loop=true;const fl=a.createBiquadFilter();fl.type=type||'lowpass';const st=a.currentTime+t0;fl.frequency.setValueAtTime(f0,st);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),st+d);const g=a.createGain();g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+.004);g.gain.exponentialRampToValueAtTime(.0001,st+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(st);s.stop(st+d+.05)}
function clink(t0,f,v){tone(f,t0,.22,'sine',v,.98);tone(f*2.41,t0,.12,'triangle',v*.5,.97);tone(f*3.9,t0,.06,'sine',v*.25)}

function boom(n,cb){const k=Math.min(1,(n-2)/12),d=.25+k*.6;noise(0,d,.55+.45*k,5200,260,'lowpass');noise(0,.05,.5,9000,3000,'highpass');tone(170,0,d*.9,'sine',.8+.2*k,.2);tone(95,0,d,'sawtooth',.18+.2*k,.3);if(n>=8){noise(.04,d+.3,.4,2400,120,'bandpass');tone(55,.02,d+.3,'sine',.9,.5)}cascade(Math.min(n,10),1500+(cb||0)*90,.04,.2)}
