async function animateTiles(items,kf,opt){await Promise.all(items.map(it=>{try{return it.animate(kf(it),opt).finished.catch(()=>{})}catch{return Promise.resolve()}}))}
async function tap(i){
if(over||busy)return;const pw=board[i]>=4,g=pw?area(i):group(i);if(g.length<2&&!pw){sfx('nope');buzz(20);$('status').textContent=t('single');return}
busy=true;const id=roundId,reduced=R();$('hint').disabled=true;$('lang').disabled=true;$('share').disabled=true;$('daily').disabled=true;
const tiles=[...$('board').children].slice(0,36);tiles.forEach(b=>{b.disabled=true;b.classList.remove('hint')});
const n=g.length,big=!pw&&n>=4;combo=(big||pw)?combo+1:0;bestCombo=Math.max(bestCombo,combo);const mx=(big||pw)?multOf(combo):1;
let base=pw?n*20+60:n*n*5,bonus=pw?0:bonusOf(n);const gained=Math.round((base+bonus)*mx);maxGroup=Math.max(maxGroup,n);
const spawn=pw?0:n>=10?5:n>=7?4:0;if(spawn)pus++;
const pr=PRAISE.find(p=>n>=p[0]);const label='+'+gained;
sfx(pw?'power':n>=8?'big':'pop',n,combo);if(combo>=2)setTimeout(()=>sfx('combo',0,combo),140);buzz(pw||n>=8?[40,30,60]:n>=4?30:15);
blast(g,mx,n,'',label,pw);
if(!reduced){g.forEach((n2,j)=>{try{tiles[n2].animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.35)',opacity:1,offset:.45},{transform:'scale(1.7)',opacity:0}],{duration:200,fill:'forwards',easing:'ease-out'})}catch{}});await new Promise(r=>setTimeout(r,210))}
if(id!==roundId)return;
const origins=Array(36).fill(0);let spawnIdx=-1;g.forEach(c=>board[c]=-1);if(spawn)board[i]=spawn;score+=gained;moves--;
// Refill order and number of seeded RNG calls stay deterministic.
for(let c=0;c<6;c++){
 const col=[],from=[];for(let r=0;r<6;r++)if(board[r*6+c]>=0){col.push(board[r*6+c]);from.push(r)}
 const missing=6-col.length;if(spawn&&c===i%6)spawnIdx=(missing+from.indexOf(Math.floor(i/6)))*6+c;while(col.length<6)col.unshift(Math.floor(rng()*4));
 for(let r=0;r<6;r++){board[r*6+c]=col[r];origins[r*6+c]=r<missing?r-missing:from[r-missing]}
}
if(score>getBest())ss('tap-pop-best-v2',score);
over=moves===0||(groups().length===0&&!board.some(v=>v>3));let sweep=0;if(over&&moves>0){sweep=moves*30;score+=sweep}
render();$('status').textContent='+'+gained+' '+t('plus')+(pr?' · '+pr[1]:'')+(mx>1?' · ×'+mx.toFixed(2).replace(/\.?0+$/,''):'');
if(spawn){setTimeout(()=>sfx('spawn'),180)}
if(!reduced){
 const next=[...$('board').children].slice(0,36),step=next[6].getBoundingClientRect().top-next[0].getBoundingClientRect().top;
 const drops=next.map((el,n2)=>({el,dy:(origins[n2]-Math.floor(n2/6))*step})).filter(d=>d.dy<0);
 sfx('fall');setTimeout(()=>{if(id===roundId)sfx('land',drops.length)},430);
 if(spawn&&spawnIdx>=0)try{next[spawnIdx].animate([{transform:'scale(0)'},{transform:'scale(1.5)',offset:.6},{transform:'scale(1)'}],{duration:600,delay:420,fill:'backwards'})}catch{}
 await Promise.all(drops.map(({el,dy})=>{try{return el.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)',offset:.62,easing:'ease-out'},{transform:'translateY(-9px)',offset:.78,easing:'ease-in'},{transform:'translateY(0)',offset:.9,easing:'ease-out'},{transform:'translateY(-2px)',offset:.95},{transform:'translateY(0)'}],{duration:600+Math.min(300,Math.abs(dy)*.8),easing:'cubic-bezier(.45,0,.9,.6)',fill:'backwards'}).finished.catch(()=>{})}catch{return Promise.resolve()}}));
 if(id!==roundId)return;
}
if(id!==roundId)return;busy=false;if(over)finish(sweep);else render();
}
function stars(){return STAR.filter(s=>score>=s).length}
function finish(sweep){
 const xp0=getXp(),l0=lvOf(xp0);ss('tap-pop-xp-v1',xp0+score);const l1=lvOf(xp0+score);const st=stars(),newBest=score>=getBest()&&score>oldBest;if(score>getBest())ss('tap-pop-best-v2',score);
 let extra='';if(seed===todaySeed()){const d=todaySeed(),last=+ls('tap-pop-daily-last',0);let sk=+ls('tap-pop-daily-streak',0);if(last!==d){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()*10000+(y.getMonth()+1)*100+y.getDate();sk=last===ys?sk+1:1;ss('tap-pop-daily-last',d);ss('tap-pop-daily-streak',sk)}extra='<br>📅 '+t('dailydone')+' · 🔥 '+sk+' '+t('streak')}

 $('status').textContent=st===3?t('allstars'):t('end');

 if(!R()&&st>0){for(let k=0;k<st;k++)setTimeout(()=>{const r=$('summary').getBoundingClientRect();blast([0],1,6,'','★',false)},900+k*320)}
}
function start(s){roundId++;busy=false;$('fxl').replaceChildren();seed=s>>>0||1;rng=makeRng(seed);board=Array.from({length:36},()=>Math.floor(rng()*4));score=0;moves=15;hints=0;over=false;combo=0;bestCombo=0;maxGroup=0;pus=0;oldBest=getBest();$('summary').style.display='none';$('shareout').style.display='none';render();$('status').textContent=t('ready');if(!groups().length){board[1]=board[0];render()}}
