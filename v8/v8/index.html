 tut_t:'Tap Pop ఎలా ఆడాలి',tut1:'పక్కపక్కన ఉన్న ఒకే రంగు బ్లాక్స్ (2+) ట్యాప్ చేయండి, అవి పేలిపోతాయి.',tut2:'పెద్ద గ్రూప్ = ఎక్కువ స్కోర్. 7+ గ్రూప్ 💣 బాంబ్, 10+ గ్రూప్ ⚡ క్రాస్ బ్లాస్ట్ ఇస్తుంది. వాటిని ట్యాప్ చేస్తే చుట్టూ పేలుతుంది.',tut3:'వరుసగా 4+ గ్రూప్స్ కొడితే కాంబో ×పెరుగుతుంది. మధ్యలో చిన్న గ్రూప్ కొడితే కాంబో పోతుంది.',tut4:'సహాయం: ↶ ఒకసారి వెనక్కి, 🔀 షఫుల్, మరియు కింద ట్రేలో 💣 🔫 🎯 🌈 ని బోర్డ్ మీదకు డ్రాగ్ చేసి వదలండి.',tut5:'మోడ్స్: లెవెల్స్ (50 లెవెల్స్, ఒక్కొక్కటి కొత్త టార్గెట్), క్లాసిక్ (15 moves), రష్ (60 సెకన్లు), జెన్ (ఒత్తిడి లేదు).',tut_go:'ఆడదాం! ▶',
 tip_first:'లెవెల్ 1: పైన టార్గెట్ చూడండి. ఎక్కువ బ్లాక్స్ ఉన్న గ్రూప్ ట్యాప్ చేయండి!',tip_stone:'కొత్తది: ▣ రాళ్ళు! రాయిని ట్యాప్ చేయలేరు. దాని పక్కన ఉన్న గ్రూప్ పేలిస్తే రాయి పగులుతుంది.',tip_time:'కొత్తది: ⏱ టైమ్ లెవెల్! moves లెక్క లేదు, సమయం లోపల టార్గెట్ కొట్టండి. మొదటి ట్యాప్‌తో టైమర్ మొదలు.',tip_multi:'కొత్తది: ఒకేసారి రెండు టార్గెట్లు! అన్నీ పూర్తి చేయాలి.',tip_boss:'👑 బాస్ లెవెల్! కఠినం. 🌈 బర్స్ట్, 🔀, ↶ వాడండి.',tip_combo:'కాంబో టార్గెట్: వరుసగా 4+ గ్రూప్స్ కొట్టండి, మధ్యలో చిన్న గ్రూప్ వద్దు.',tip_power:'పవర్-అప్ టార్గెట్: 7+ గ్రూప్ కొడితే 💣 వస్తుంది.',trayhint:'💣 🔫 🎯 🌈 ని కింద నుండి బోర్డ్ మీదకు డ్రాగ్ చేసి వదలండి. (లేదా ఒకసారి ట్యాప్ చేసి, తర్వాత బ్లాక్ ట్యాప్ చేయండి.) బోర్డ్ బయట వదిలితే రద్దు.',nohelp:'🚫 ఈ లెవెల్‌లో సహాయాలు లేవు!',laserask:'ఏ వరుస (row) కొట్టాలో ఆ వరుసలో ఏదైనా బ్లాక్ ట్యాప్ చేయండి. ఆ వరుస మొత్తం పేలుతుంది.',snipeask:'ఒక్క బ్లాక్ ఎంచుకోండి. అది మాత్రమే పేలుతుంది (రాయి అయినా సరే).',tip_laser:'కొత్త సహాయం: 🔫 లేజర్! బోర్డ్ మీదకు డ్రాగ్ చేస్తే ఆ వరుస మొత్తం పేలుతుంది. రాళ్ళు కూడా పగులుతాయి.',tip_snipe:'కొత్త సహాయం: 🎯 స్నైపర్! ఒకే ఒక్క బ్లాక్‌ను (రాయి, మంచు బ్లాక్ కూడా) గురి చూసి పేల్చండి. చివరి బ్లాక్ కోసం సూపర్.',bombask:'ఎక్కడ పేల్చాలో ఆ బ్లాక్ ట్యాప్ చేయండి. చుట్టూ 3×3 పేలుతుంది.',dragcancel:'రద్దు అయింది. ఏమీ ఖర్చు కాలేదు.',m_ice:'మంచు బ్లాక్స్ పగలగొట్టండి',tip_ice:'కొత్తది: ❄ మంచు బ్లాక్! రెండుసార్లు కొట్టాలి: మొదటి దెబ్బకు మంచు పగులుతుంది (బ్లాక్ అక్కడే ఉంటుంది), రెండోసారి పేలుతుంది.',tip_d6:'కొత్తది: కింద 💣 ఉంది. దాన్ని వేలితో పట్టుకుని బోర్డ్ మీద ఒక చోట వదలండి. చుట్టూ 3×3 పేలుతుంది!',tip_d14:'🌈 ని డ్రాగ్ చేసి ఒక రంగు బ్లాక్ మీద వదలండి. ఆ రంగు అన్నీ పేలతాయి. ఈ లెవెల్‌కు ఇదే తెలివైన దారి.',tip_d24:'❄ మంచు బ్లాక్స్ ఉన్న చోట 💣 వేస్తే ఒకేసారి చాలా మంచు పగులుతుంది. 💣 ఒక్కటే, ఎక్కడ వేయాలో ఆలోచించండి.',tip_d34:'▣ రాళ్ళు వరుసగా అడ్డుగా ఉన్నాయి. వాటి పక్కన గ్రూప్స్ పేల్చి రాళ్ళను పగలగొట్టండి. సహాయాలు తక్కువ!',tip_d44:'ఇక్కడ 💣 మూడు మాత్రమే, moves కూడా తక్కువ. ప్రతి 💣 ఎక్కడ వేస్తే ఎక్కువ బ్లాక్స్ పోతాయో చూడండి.',tip_nohelp:'👑 బాస్ లెవెల్! సహాయాలు ఏమీ లేవు, మీ తెలివి మాత్రమే.',tip_par:'★ రూల్: తక్కువ moves లో గెలిస్తే ఎక్కువ స్టార్స్. పైన ★★★ ≤ సంఖ్య చూడండి.',prog_now:'ఇప్పుడు',lvdone:'పూర్తయిన లెవెల్స్'},

 const gap=x.last?dayNumber(d)-dayNumber(x.last):999;if(gap<0)return {...x,earned:0};
 if(gap===1)x.count++;else if(gap===2&&!x.graceUsed){x.count++;x.graceUsed=true}else{x.count=1;x.graceUsed=false}
 x.last=d;const earned=25+Math.min(x.count,7)*5+(x.count===7?100:0);x.coins=(x.coins||0)+earned;if(x.count>=7)x.gold=true;
 ss('tp8-rewards',JSON.stringify(x));ss('tap-pop-daily-last',d);ss('tap-pop-daily-streak',x.count);returnLabels();return {...x,earned};
}

function shareInfo(){const g=G,u=new URL(location.href);u.search='';let stars,msg;if(g.mode==='puzzle'){u.searchParams.set('m','p');u.searchParams.set('lv',g.lv);stars=lvlStars(g.lv);msg=te?'Tap Pop పజిల్ లెవెల్ '+g.lv+'! నా స్కోర్ '+g.score+'. మీరు చేయగలరా?':'Tap Pop puzzle level '+g.lv+'! My score: '+g.score+'. Can you beat it?'}else{if(g.mode!=='classic')u.searchParams.set('m',g.mode==='rush'?'r':'z');u.searchParams.set('seed',g.seed);u.searchParams.set('sv',g.mode==='classic'?SV_CLASSIC:SV_NEW);stars=scoreStars(g);msg=te?'Tap Pop '+t('m_'+g.mode)+'లో నా స్కోర్ '+g.score+'! ఇదే బోర్డ్‌లో మీ స్కోర్ ఎంత?':'My Tap Pop '+t('m_'+g.mode)+' score is '+g.score+'! Try the same board.'}return {title:'Tap Pop Challenge',text:msg+' '+'★'.repeat(stars)+'☆'.repeat(3-stars),url:u.href,stars}}
function cardIdentity(){return G.mode+':'+G.lv+':'+G.seed+':'+G.score+':'+te+':'+lvlStars(G.lv)}
function queueCard(){clearTimeout(cardTimer);cardTimer=setTimeout(()=>makeCard().catch(()=>{}),80)}
async function makeCard(){const key=cardIdentity(),g={...G},info=shareInfo(),c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#0c1022';x.fillRect(0,0,1080,1350);const gr=x.createLinearGradient(0,0,1080,1350);gr.addColorStop(0,'#30365b');gr.addColorStop(1,'#080d1c');x.fillStyle=gr;x.fillRect(40,40,1000,1270);x.textAlign='center';x.fillStyle='#ffd76a';x.font='bold 30px system-ui';x.fillText('SV PRIME EDITS',540,112);x.fillStyle='#aff7d2';x.font='bold 94px system-ui';x.fillText('Tap Pop',540,242);x.fillStyle='#d4dcf7';x.font='32px system-ui';x.fillText(g.mode==='puzzle'?'PUZZLE · LEVEL '+g.lv:g.mode.toUpperCase()+' · SAME BOARD',540,310);x.fillStyle='#ffffff';x.font='bold 140px system-ui';x.fillText(String(g.score),540,485);x.font='32px system-ui';x.fillText(te?'నా స్కోర్':'MY SCORE',540,546);x.fillStyle='#ffd76a';x.font='62px system-ui';x.fillText('★'.repeat(info.stars)+'☆'.repeat(3-info.stars),540,640);const colors=['#ffabbb','#83c9ff','#ffe392','#92edbd','#ffb36b','#b9a0ff','#8b93a8'];g.board.forEach((v,i)=>{if(v<0)return;const cx=318+(i%6)*88,cy=748+Math.floor(i/6)*65;x.fillStyle=colors[v];x.beginPath();x.arc(cx,cy,24,0,Math.PI*2);x.fill();x.strokeStyle=g.ice?.[i]?'#fff':'#ffd76a';x.lineWidth=3;x.stroke()});x.fillStyle='#aff7d2';x.font='bold 38px system-ui';x.fillText(te?'నా స్కోర్ కొట్టగలరా?':'CAN YOU BEAT MY SCORE?',540,1180);x.fillStyle='#aeb5d9';x.font='24px system-ui';x.fillText('50 levels · Telugu + English · No login',540,1240);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob||key!==cardIdentity())return null;cardFile=new File([blob],'tap-pop-score.png',{type:'image/png'});cardKey=key;if(cardUrl)URL.revokeObjectURL(cardUrl);cardUrl=URL.createObjectURL(blob);return cardFile}
function shareFallback(info){simpleModal('<h2>'+(te?'స్కోర్ కార్డ్ షేర్':'Share score card')+'</h2>'+(cardUrl?'<img class="sharepic" src="'+cardUrl+'" alt="Tap Pop score card">':'')+'<div class="sharelinks">'+(cardUrl?'<a download="tap-pop-score.png" href="'+cardUrl+'">'+(te?'ఇమేజ్ సేవ్ చేయండి':'Save image')+'</a>':'')+'<button class="primary wide" id="copyshare">'+(te?'స్కోర్ + ఫ్రెండ్ లింక్ కాపీ':'Copy score + friend link')+'</button><a id="wafallback" target="_blank" rel="noopener">WhatsApp ↗</a></div><p class="dim">'+(te?'ఇమేజ్ సేవ్ చేసి WhatsApp లో పంపండి. అదే బోర్డ్ కోసం కాపీ చేసిన లింక్ కూడా పేస్ట్ చేయండి. WhatsApp బటన్ సాధారణ గేమ్ లింక్ తెరుస్తుంది.':'Save the image and attach it in WhatsApp. Paste the copied friend link to play the same board. The WhatsApp button opens a general game link.')+'</p><button class="secondary wide" id="xclose">'+t('next')+'</button>');$('wafallback').href=WA_FALLBACK;$('copyshare').onclick=async()=>{try{await navigator.clipboard.writeText(info.text+'\n'+info.url);toast(t('copy'))}catch{$('shareout').textContent=info.text+' '+info.url;$('shareout').style.display='block';closeModal()}}}
$('share').onclick=async()=>{const info=shareInfo();if(cardFile&&cardKey===cardIdentity()&&navigator.share&&navigator.canShare?.({files:[cardFile]})){try{await navigator.share({title:info.title,text:info.text+'\n'+info.url,files:[cardFile]});return}catch(e){if(e.name==='AbortError')return}}if(navigator.share){try{await navigator.share(info);return}catch(e){if(e.name==='AbortError')return}}await makeCard().catch(()=>{});shareFallback(info)};
